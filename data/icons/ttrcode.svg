<?xml version="1.0" encoding="UTF-8"?>
<!-- ttrcode: a window with a file tree, colored code and an output pane.
     Drawn on a 48 pixel grid so it stays sharp at 16, 32 and 48 pixels. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- The window, its title bar and menu bar -->
  <rect x="2" y="4" width="44" height="40" fill="#1c1c1c"/>
  <rect x="3" y="5" width="42" height="38" fill="#c0c0c0"/>
  <rect x="3" y="5" width="42" height="5" fill="#4a6ea8"/>
  <rect x="4" y="6" width="4" height="3" fill="#c0c0c0"/>
  <rect x="5" y="11" width="4" height="1" fill="#404040"/>
  <rect x="11" y="11" width="4" height="1" fill="#404040"/>
  <rect x="17" y="11" width="5" height="1" fill="#404040"/>
  <!-- The file tree -->
  <rect x="4" y="14" width="12" height="20" fill="#808080"/>
  <rect x="5" y="15" width="11" height="19" fill="#f4f4f4"/>
  <g fill="#606060">
    <rect x="6" y="17" width="7" height="1"/>
    <rect x="8" y="20" width="6" height="1"/>
    <rect x="8" y="23" width="5" height="1"/>
    <rect x="8" y="26" width="6" height="1"/>
    <rect x="6" y="29" width="7" height="1"/>
  </g>
  <rect x="7" y="22" width="8" height="3" fill="#4a6ea8"/>
  <rect x="8" y="23" width="5" height="1" fill="#ffffff"/>
  <!-- The code -->
  <rect x="17" y="14" width="27" height="20" fill="#808080"/>
  <rect x="18" y="15" width="26" height="19" fill="#ffffff"/>
  <rect x="19" y="17" width="5" height="1" fill="#1f3fbf"/>
  <rect x="25" y="17" width="9" height="1" fill="#202020"/>
  <rect x="21" y="20" width="4" height="1" fill="#1f3fbf"/>
  <rect x="26" y="20" width="5" height="1" fill="#202020"/>
  <rect x="32" y="20" width="8" height="1" fill="#b02020"/>
  <rect x="21" y="23" width="12" height="1" fill="#2f8f3f"/>
  <rect x="21" y="26" width="3" height="1" fill="#1f3fbf"/>
  <rect x="25" y="26" width="6" height="1" fill="#202020"/>
  <rect x="32" y="26" width="3" height="1" fill="#b02020"/>
  <rect x="23" y="29" width="10" height="1" fill="#202020"/>
  <rect x="19" y="31" width="2" height="1" fill="#202020"/>
  <!-- The output pane -->
  <rect x="4" y="35" width="40" height="7" fill="#808080"/>
  <rect x="5" y="36" width="39" height="6" fill="#f4f4f4"/>
  <rect x="6" y="38" width="14" height="1" fill="#606060"/>
  <rect x="6" y="40" width="22" height="1" fill="#606060"/>
</svg>
