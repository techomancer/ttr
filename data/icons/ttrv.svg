<?xml version="1.0" encoding="UTF-8"?>
<!-- ttrv: a window with a photograph (sky, sun, hills) and a strip of
     thumbnails. Plain rectangles on a 48 pixel grid, so it stays sharp at
     16, 32 and 48 pixels and tools/svg2fti.py can make the IRIX icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- The window and its title bar -->
  <rect x="2" y="4" width="44" height="40" fill="#1c1c1c"/>
  <rect x="3" y="5" width="42" height="38" fill="#c0c0c0"/>
  <rect x="3" y="5" width="42" height="5" fill="#4a6ea8"/>
  <rect x="4" y="6" width="4" height="3" fill="#c0c0c0"/>
  <!-- The photograph: sky, sun, two hills, grass -->
  <rect x="5" y="12" width="38" height="23" fill="#808080"/>
  <rect x="6" y="13" width="37" height="22" fill="#6fa8dc"/>
  <rect x="34" y="15" width="4" height="5" fill="#ffd23f"/>
  <rect x="33" y="16" width="6" height="3" fill="#ffd23f"/>
  <g fill="#8fae6f">
    <rect x="28" y="22" width="4" height="2"/>
    <rect x="26" y="24" width="8" height="2"/>
    <rect x="24" y="26" width="12" height="2"/>
    <rect x="22" y="28" width="17" height="2"/>
  </g>
  <g fill="#4f6f3f">
    <rect x="15" y="19" width="4" height="2"/>
    <rect x="13" y="21" width="8" height="2"/>
    <rect x="11" y="23" width="12" height="2"/>
    <rect x="9" y="25" width="16" height="2"/>
    <rect x="7" y="27" width="20" height="3"/>
  </g>
  <rect x="15" y="19" width="4" height="1" fill="#ffffff"/>
  <rect x="6" y="30" width="37" height="5" fill="#3f8f2f"/>
  <!-- The thumbnails -->
  <rect x="5" y="36" width="11" height="7" fill="#808080"/>
  <rect x="6" y="37" width="9" height="5" fill="#d0a060"/>
  <rect x="18" y="36" width="11" height="7" fill="#808080"/>
  <rect x="19" y="37" width="9" height="5" fill="#a04040"/>
  <rect x="31" y="36" width="12" height="7" fill="#4a6ea8"/>
  <rect x="32" y="37" width="10" height="5" fill="#6fa8dc"/>
</svg>
